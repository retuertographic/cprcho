<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Capricho de Costa del Silencio — Carta y Tienda Gourmet</title>
<style>
  :root{
    color-scheme: light dark;
    --bg: #ece1c7;
    --bg-elev: #f6efdc;
    --bg-panel: #e4d7b8;
    --ink: #2b2115;
    --ink-soft: #6b5a41;
    --ink-faint: #8d7a5c;
    --accent: #8a6423;
    --accent-2: #7a2331;
    --rule: rgba(43,33,21,0.22);
    --rule-strong: rgba(43,33,21,0.38);
    --chip-bg: rgba(43,33,21,0.06);
    --chip-bg-active: #2b2115;
    --chip-ink-active: #ece1c7;
    --row-hover: rgba(43,33,21,0.045);
    --shadow: 0 10px 30px rgba(43,33,21,0.14);
    --stamp-ink: #8a6423;

    --serif: 'Iowan Old Style','Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif;
    --sans: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', 'Courier New', monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg: #14140d;
      --bg-elev: #1c1b12;
      --bg-panel: #201f15;
      --ink: #ece3ce;
      --ink-soft: #b3a482;
      --ink-faint: #7d7256;
      --accent: #cba15e;
      --accent-2: #b16b6a;
      --rule: rgba(236,227,206,0.14);
      --rule-strong: rgba(236,227,206,0.26);
      --chip-bg: rgba(236,227,206,0.07);
      --chip-bg-active: #ece3ce;
      --chip-ink-active: #14140d;
      --row-hover: rgba(236,227,206,0.045);
      --shadow: 0 10px 30px rgba(0,0,0,0.45);
      --stamp-ink: #cba15e;
    }
  }
  :root[data-theme="dark"]{
    --bg: #14140d; --bg-elev: #1c1b12; --bg-panel: #201f15;
    --ink: #ece3ce; --ink-soft: #b3a482; --ink-faint: #7d7256;
    --accent: #cba15e; --accent-2: #b16b6a;
    --rule: rgba(236,227,206,0.14); --rule-strong: rgba(236,227,206,0.26);
    --chip-bg: rgba(236,227,206,0.07); --chip-bg-active:#ece3ce; --chip-ink-active:#14140d;
    --row-hover: rgba(236,227,206,0.045); --shadow: 0 10px 30px rgba(0,0,0,0.45); --stamp-ink:#cba15e;
  }
  :root[data-theme="light"]{
    --bg: #ece1c7; --bg-elev:#f6efdc; --bg-panel:#e4d7b8;
    --ink:#2b2115; --ink-soft:#6b5a41; --ink-faint:#8d7a5c;
    --accent:#8a6423; --accent-2:#7a2331;
    --rule: rgba(43,33,21,0.22); --rule-strong: rgba(43,33,21,0.38);
    --chip-bg: rgba(43,33,21,0.06); --chip-bg-active:#2b2115; --chip-ink-active:#ece1c7;
    --row-hover: rgba(43,33,21,0.045); --shadow: 0 10px 30px rgba(43,33,21,0.14); --stamp-ink:#8a6423;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    position: relative;
  }
  body::before{
    content:"";
    position: fixed; inset:0; pointer-events:none; z-index:0;
    opacity:.5; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/></svg>");
  }
  @media (prefers-color-scheme: dark){ body::before{ mix-blend-mode: screen; } }
  :root[data-theme="dark"] body::before{ mix-blend-mode: screen; }
  :root[data-theme="light"] body::before{ mix-blend-mode: multiply; }

  a{ color: inherit; }
  ::selection{ background: var(--accent); color: var(--bg); }

  :focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 3px;
  }

  h1,h2,h3{ text-wrap: balance; margin: 0; }

  .wrap{ max-width: 980px; margin: 0 auto; padding: 0 clamp(14px,4vw,32px); position:relative; z-index:1; }

  /* ---------- header ---------- */
  header.top{
    position: sticky; top:0; z-index: 20;
    background: var(--bg-elev);
    box-shadow: var(--shadow);
  }
  /* mobile-first header: row 1 = hamburger / logo / language, row 2 = subtitle (wraps full width) */
  .top-inner{
    max-width: 980px; margin:0 auto;
    padding: 14px 14px 16px;
    display:flex; align-items:center; flex-wrap: wrap; gap: 10px 12px;
  }
  .hamburger{
    order: 1; flex: none;
    width: 48px; height: 48px;
    display:flex; align-items:center; justify-content:center;
    border-radius: 12px;
    border: 1px solid var(--rule-strong);
    background: var(--chip-bg);
    color: var(--ink);
    cursor: pointer;
  }
  .hamburger:hover{ border-color: var(--accent); }
  .logo-plaque{
    order: 2; flex: none;
    margin: 0 auto;
    background: #f8f4e6;
    border-radius: 10px;
    padding: 6px 14px;
    box-shadow: var(--shadow);
    display:flex; align-items:center;
    transform: rotate(-1.2deg);
  }
  .logo-img{
    display:block;
    height: clamp(34px, 10vw, 48px);
    width: auto;
    max-width: 100%;
  }
  .brand-block{ order: 4; flex: 1 1 100%; text-align: center; }
  .brand-tag{
    margin-top: 2px;
    font-family: var(--mono);
    font-size: .85rem; letter-spacing: .08em; text-transform: uppercase;
    color: var(--ink-soft);
  }

  .lang-toggle{ order: 3; flex: none; }
  .lang-select{
    font-family: var(--mono); font-size: 1rem; letter-spacing:.05em;
    min-height: 48px;
    padding: 8px 34px 8px 16px;
    border-radius: 999px;
    border: 1px solid var(--rule-strong);
    background: var(--chip-bg);
    color: var(--ink);
    cursor: pointer;
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b5a41' stroke-width='2'><path d='m6 9 6 6 6-6'/></svg>");
    background-repeat: no-repeat;
    background-position: right 12px center;
    background-size: 14px;
  }
  .lang-select:hover{ border-color: var(--accent); }
  .row-gloss{
    font-family: var(--sans); font-style: italic;
    font-size: .875rem; color: var(--ink-faint);
    margin-left: 6px;
  }

  @media (min-width: 768px){
    .top-inner{
      flex-wrap: nowrap;
      padding: clamp(18px,3vw,28px) clamp(14px,4vw,32px) 20px;
      gap: 20px;
    }
    .hamburger{ display:none; }
    .logo-plaque{ order:0; margin:0; padding: 8px 16px; }
    .logo-img{ height: clamp(40px, 7vw, 54px); }
    .brand-block{ order:0; flex: 1 1 220px; min-width: 200px; text-align: left; }
    .brand-tag{ font-size: .72rem; letter-spacing: .1em; }
    .lang-toggle{ order:0; margin-left: auto; }
    .lang-select{ font-size: .72rem; min-height: 0; padding: 8px 30px 8px 14px; }
  }

  /* perforated ticket line under header */
  .perf{
    height: 12px;
    background-image: radial-gradient(circle at center, var(--bg) 2.6px, transparent 2.9px);
    background-size: 16px 12px;
    background-repeat: repeat-x;
    background-position: center;
  }

  /* ---------- category navigation: full-screen drawer on mobile, sticky bar on desktop ---------- */
  nav.rail{
    position: fixed; inset: 0; z-index: 30;
    background: var(--bg-elev);
    display: flex; flex-direction: column;
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease;
  }
  nav.rail.open{ opacity: 1; pointer-events: auto; }
  @media (prefers-reduced-motion: reduce){ nav.rail{ transition:none; } }
  .rail-head{
    flex: none;
    display:flex; align-items:center; justify-content:space-between;
    padding: 16px 18px;
    border-bottom: 1px solid var(--rule);
  }
  .rail-head-title{
    font-family: var(--serif); font-weight:600; font-size: 1.25rem;
  }
  .rail-close{
    flex:none; width:48px; height:48px;
    display:flex; align-items:center; justify-content:center;
    border-radius: 12px; border: 1px solid var(--rule-strong);
    background: var(--chip-bg); color: var(--ink);
    font-size: 1.4rem; line-height:1; cursor:pointer;
  }
  .rail-inner{
    flex: 1 1 auto; overflow-y: auto;
    max-width: 980px; width:100%; margin:0 auto;
    padding: 10px 14px 24px;
    display:flex; flex-direction:column; gap:6px;
  }
  .chip{
    display:flex; align-items:center;
    min-height: 48px;
    font-family: var(--serif); font-size: 1.0625rem;
    padding: 10px 16px;
    border-radius: 12px;
    background: var(--chip-bg);
    border: 1px solid transparent;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
    transition: background .15s ease, color .15s ease;
  }
  @media (prefers-reduced-motion: reduce){ .chip{ transition:none; } }
  .chip:hover{ border-color: var(--rule-strong); }
  .chip.active{ background: var(--chip-bg-active); color: var(--chip-ink-active); }

  @media (min-width: 768px){
    nav.rail{
      position: sticky; inset:auto; top: 0; z-index: 19;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--rule);
      opacity:1; pointer-events:auto;
      display:block;
    }
    .rail-head{ display:none; }
    .rail-inner{
      padding: 10px clamp(14px,4vw,32px);
      flex-direction:row; gap:8px; overflow-x:auto; overflow-y:visible;
      scrollbar-width: thin;
    }
    .rail-inner::-webkit-scrollbar{ height:5px; }
    .rail-inner::-webkit-scrollbar-thumb{ background: var(--rule-strong); border-radius:4px; }
    .chip{
      flex:none; min-height:0;
      font-family: var(--mono); font-size: .72rem; letter-spacing:.04em;
      text-transform: uppercase;
      padding: 7px 13px;
      border-radius: 999px;
      white-space: nowrap;
    }
  }

  /* ---------- main / sections ---------- */
  main{ padding-top: clamp(28px,4vw,44px); padding-bottom: 60px; }

  section.cat{ margin-bottom: clamp(34px,5vw,52px); scroll-margin-top: 118px; }

  .cat-head{
    display:flex; align-items:flex-end; gap: 16px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--ink);
    margin-bottom: 18px;
  }
  .cat-badge{
    flex:none; width:40px; height:40px; border-radius:50%;
    border: 1px dashed var(--stamp-ink);
    display:flex; align-items:center; justify-content:center;
    font-family: var(--mono); font-size:.82rem; color: var(--stamp-ink);
  }
  .cat-title{
    font-family: var(--serif); font-weight:600;
    font-size: clamp(1.375rem, 5vw, 1.6rem);
    flex: 1 1 auto;
  }
  .row-num{
    flex: none;
    font-family: var(--mono); font-variant-numeric: tabular-nums;
    font-size: .85rem; color: var(--ink-faint);
    min-width: 2.6em;
    padding-top: 2px;
  }

  /* mobile-first: single column always; more columns only once there is real room */
  .grid{
    display:grid;
    grid-template-columns: 1fr;
    row-gap: 4px;
  }
  @media (min-width: 700px){
    .grid{
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      column-gap: 34px;
    }
  }

  .row{
    display:flex; align-items:flex-start; gap:12px;
    padding: 14px 6px;
    min-height: 48px;
    border-bottom: 1px dotted var(--rule-strong);
  }
  .row:hover{ background: var(--row-hover); }
  .row-main{ flex: 1 1 auto; min-width:0; }
  .row-name{
    font-family: var(--serif); font-size: 1.0625rem; line-height:1.4;
    display:inline;
  }
  .row-tag{
    font-family: var(--mono); font-size: .7rem; letter-spacing:.08em;
    color: var(--accent-2); border: 1px solid var(--accent-2);
    border-radius: 3px; padding: 2px 6px; margin-left:7px;
    vertical-align: 2px; white-space:nowrap;
  }
  .row-desc{
    display:block; font-family: var(--sans); font-style: italic;
    font-size: .875rem; color: var(--ink-soft); margin-top: 4px; line-height:1.4;
  }
  .leader{
    flex: 1 1 auto; min-width: 14px;
    border-bottom: 1px dotted var(--rule);
    align-self: flex-end;
    margin-bottom: 6px;
  }
  .row-price{
    flex: none;
    font-family: var(--mono); font-variant-numeric: tabular-nums;
    font-size: 1.0625rem; font-weight: 600; color: var(--accent);
    white-space: nowrap;
    padding-top: 1px;
  }

  footer{
    max-width: 980px; margin: 0 auto; padding: 28px clamp(14px,4vw,32px) 70px;
    border-top: 1px solid var(--rule);
    color: var(--ink-faint); font-size: .9rem;
    display:flex; justify-content: space-between; gap:16px 24px; flex-wrap:wrap;
  }
  footer .fnote{ font-family: var(--serif); font-style: italic; line-height: 1.6; }
  footer .fnote b{ font-style: normal; font-weight: 600; color: var(--ink-soft); }
  footer .fmono{ font-family: var(--mono); letter-spacing:.04em; }
</style>
</head>

      {es:"Pieza Jamon de cebo", en:"Whole cebo ham", price:"245.80 €"}
    ]},
    {es:"Servicios", en:"Services", fr:"Services", de:"Service", nl:"Diensten", ru:"Услуги", it:"Servizi", pt:"Serviços", items:[
      {es:"Descorche", en:"Corkage", price:"6.00 €"},
      {es:"Servicio mesa", en:"Table service", price:"5.00 €"},
      {es:"Jamon Cortado y Envasado Cuchillo", en:"Hand-carved & vacuum-packed ham", price:"65.00 €"}
    ]},
    {es:"Hoteles", en:"Hotel amenities", fr:"Articles pour hôtels", de:"Hotelartikel", nl:"Hotelartikelen", ru:"Товары для отелей", it:"Articoli per hotel", pt:"Artigos para hotéis", items:[
      {es:"Mini sobres", en:"Mini sachets", price:"2.35 €",
        descEs:"Mini sobres  30g brida blanca", descEn:"Mini sachets, 30g, white pack", descFr:"Mini sachets, 30g, emballage blanc", descDe:"Mini-Tütchen, 30g, weiße Verpackung", descNl:"Mini-zakjes, 30g, witte verpakking", descRu:"Мини-пакетики, 30г, белая упаковка", descIt:"Mini bustine, 30g, confezione bianca", descPt:"Mini saquetas, 30g, embalagem branca"}
    ]}
  ];
  if (window.MENU_DATA && window.MENU_DATA.length) { DATA = window.MENU_DATA; }

  function esc(s){
    return s.replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  function slug(esTitle,i){
    return "cat-" + i + "-" + esTitle.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
  }

  var rail = document.getElementById("rail");
  var catalog = document.getElementById("catalog");
  var langSelect = document.getElementById("langSelect");
  var navRail = document.getElementById("navRail");
  var hamburgerBtn = document.getElementById("hamburgerBtn");
  var railClose = document.getElementById("railClose");
  var currentLang = "es";
  var io = null;

  function openDrawer(){
    navRail.classList.add("open");
    navRail.setAttribute("aria-hidden", "false");
    hamburgerBtn.setAttribute("aria-expanded", "true");
    document.body.style.overflow = "hidden";
  }
  function closeDrawer(){
    navRail.classList.remove("open");
    navRail.setAttribute("aria-hidden", "true");
    hamburgerBtn.setAttribute("aria-expanded", "false");
    document.body.style.overflow = "";
  }
  hamburgerBtn.addEventListener("click", openDrawer);
  railClose.addEventListener("click", closeDrawer);
  navRail.addEventListener("click", function(e){ if(e.target === navRail) closeDrawer(); });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeDrawer(); });

  function build(lang){
    currentLang = lang;
    document.documentElement.lang = lang;
    langSelect.value = lang;

    if(io){ io.disconnect(); }
    rail.innerHTML = "";
    catalog.innerHTML = "";

    var sectionEls = [];
    var chipEls = [];
    var nextNum = 1;

    DATA.forEach(function(cat, i){
      var displayTitle = cat[lang] || cat.es;
      var id = slug(cat.es, i);
      var blockSize = Math.ceil(cat.items.length / 10) * 10;
      var blockStart = nextNum;
      nextNum = blockStart + blockSize;

      var chip = document.createElement("button");
      chip.className = "chip";
      chip.type = "button";
      chip.textContent = displayTitle;
      chip.addEventListener("click", function(){
        closeDrawer();
        document.getElementById(id).scrollIntoView({
          behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth",
          block: "start"
        });
      });
      rail.appendChild(chip);
      chipEls.push({id:id, el:chip});

      var section = document.createElement("section");
      section.className = "cat";
      section.id = id;

      var head = document.createElement("div");
      head.className = "cat-head";
      head.innerHTML =
        '<div class="cat-badge">' + String(i+1).padStart(2,"0") + '</div>' +
        '<h2 class="cat-title">' + esc(displayTitle) + '</h2>';
      section.appendChild(head);

      var grid = document.createElement("div");
      grid.className = "grid";

      cat.items.forEach(function(it, idx){
        var name = nameFor(it, lang);
        var gloss = glossFor(it, lang);
        var desc = descFor(it, lang);
        var num = String(blockStart + idx).padStart(3,"0");
        var row = document.createElement("div");
        row.className = "row";
        row.innerHTML =
          '<span class="row-num">' + num + '</span>' +
          '<div class="row-main">' +
            '<span class="row-name">' + esc(name) + '</span>' +
            (gloss ? '<span class="row-gloss">(' + esc(gloss) + ')</span>' : '') +
            (it.shop ? '<span class="row-tag">' + esc(STR[lang].shopTag) + '</span>' : '') +
            (desc ? '<span class="row-desc">' + esc(desc) + '</span>' : '') +
          '</div>' +
          '<div class="leader"></div>' +
          '<div class="row-price">' + esc(it.price) + '</div>';
        grid.appendChild(row);
      });

      section.appendChild(grid);
      catalog.appendChild(section);
      sectionEls.push(section);
    });

    document.getElementById("brandSubtitle").textContent = STR[lang].subtitle;
    document.getElementById("footerLegal").textContent = STR[lang].priceNote;

    io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        var match = chipEls.find(function(c){ return c.id === entry.target.id; });
        if(match) match.el.classList.toggle("active", entry.isIntersecting);
      });
    }, { rootMargin: "-115px 0px -75% 0px", threshold: 0 });
    sectionEls.forEach(function(s){ io.observe(s); });
  }

  langSelect.addEventListener("change", function(){
    if(LANGS.indexOf(this.value) !== -1 && this.value !== currentLang) build(this.value);
  });

  build("es");
})();
</script>

</body></html>
